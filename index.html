  function updateFamilySummary(summaryEl) {
    var total = 0, pCount = 0;
    state.people.forEach(function (person) {
      var pn = 0;
      state.pages.forEach(function (page) { pn += countPageNeed(page, person); });
      if (pn > 0) { total += pn; pCount++; }
    });
    if (total === 0) {
      summaryEl.innerHTML = "All set \u2014 everyone has every item covered.";
    } else {
      summaryEl.innerHTML = "<span class=\"ct\">" + total + "</span> item" + (total !== 1 ? "s" : "") +
        " still needed for <span class=\"ct\">" + pCount + "</span> " + (pCount !== 1 ? "people" : "person") + ".";
    }
  }

  // ---------- per-cell editor ----------
  var edit = { pid: null, pgid: null, rid: null, cid: null, wrap: null };

  function openCellEditor(pid, pgid, rid, cid, rowLabel, catLabel, wrap) {
    edit.pid = pid; edit.pgid = pgid; edit.rid = rid; edit.cid = cid; edit.wrap = wrap;
    document.getElementById("cellTitle").textContent = activePerson().name + "  \u00B7  " + rowLabel + "  \u00B7  " + catLabel;
    renderCellBody();
    document.getElementById("cellOverlay").classList.add("open");
  }
  function closeCell() { document.getElementById("cellOverlay").classList.remove("open"); }
  function noteListEl() { return document.getElementById("cellNoteList"); }

  function makeNoteRow(value) {
    var row = el("div", "noterow");
    var inp = el("input", "noteinput"); inp.type = "text"; inp.value = value || ""; inp.placeholder = "e.g. reg fit, hand-me-down";
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
    inp.addEventListener("blur", commitNotes);
    var del = el("button", "minibtn del"); del.type = "button"; del.title = "Remove note"; del.innerHTML = ICON.trash;
    del.addEventListener("click", function () { row.parentNode.removeChild(row); commitNotes(); });
    row.appendChild(inp); row.appendChild(del);
    return row;
  }
  function commitNotes() {
    var list = noteListEl();
    if (!list || edit.pid == null) return;
    var arr = [];
    var inputs = list.querySelectorAll(".noteinput");
    Array.prototype.forEach.call(inputs, function (i) { var v = i.value.trim(); if (v) arr.push(v); });
    setNotesArr(edit.pid, edit.pgid, edit.rid, edit.cid, arr);
    if (edit.wrap) updateCellVisual(edit.wrap);
  }
  function renderCellBody() {
    var body = document.getElementById("cellBody");
    body.innerHTML = "";
    body.appendChild(el("div", "cellsecttitle", "Quantity"));
    var qr = el("div", "qtyrow");
    qr.appendChild(el("label", null, "0 = don\u2019t have it"));
    var minus = el("button", "stepbtn", "\u2212"); minus.type = "button"; minus.title = "Less";
    var qty = el("input", "qty"); qty.type = "text"; qty.setAttribute("inputmode", "numeric");
    qty.value = String(qtyOf(edit.pid, edit.pgid, edit.rid, edit.cid));
    var plus = el("button", "stepbtn", "+"); plus.type = "button"; plus.title = "More";
    function commitQty() {
      var n = parseInt(qty.value, 10); if (isNaN(n) || n < 0) n = 0;
      setQty(edit.pid, edit.pgid, edit.rid, edit.cid, n);
      qty.value = String(qtyOf(edit.pid, edit.pgid, edit.rid, edit.cid));
      if (edit.wrap) updateCellVisual(edit.wrap);
    }
    function step(d) {
      var n = qtyOf(edit.pid, edit.pgid, edit.rid, edit.cid) + d; if (n < 0) n = 0;
      setQty(edit.pid, edit.pgid, edit.rid, edit.cid, n);
      qty.value = String(n);
      if (edit.wrap) updateCellVisual(edit.wrap);
    }
    minus.addEventListener("click", function () { step(-1); });
    plus.addEventListener("click", function () { step(1); });
    qty.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { qty.blur(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); step(1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); step(-1); }
    });
    qty.addEventListener("blur", commitQty);
    qr.appendChild(minus); qr.appendChild(qty); qr.appendChild(plus);
    body.appendChild(qr);

    body.appendChild(el("div", "cellsecttitle", "Notes"));
    var list = el("div"); list.id = "cellNoteList";
    body.appendChild(list);
    var notes = notesOf(edit.pid, edit.pgid, edit.rid, edit.cid);
    if (notes.length) notes.forEach(function (n) { list.appendChild(makeNoteRow(n)); });
    var addNote = el("button", "addbtn"); addNote.type = "button"; addNote.innerHTML = ICON.plus + "<span>Add note</span>";
    addNote.addEventListener("click", function () { var r = makeNoteRow(""); list.appendChild(r); r.querySelector(".noteinput").focus(); });
    body.appendChild(addNote);
    var actions = el("div", "cellactions");
    var done = el("button", "primarybtn", "Done"); done.type = "button";
    done.addEventListener("click", function () { commitNotes(); closeCell(); });
    actions.appendChild(done);
    body.appendChild(actions);
  }

  function setView(v) {
    viewMode = v;
    document.getElementById("viewInv").classList.toggle("on", v === "inventory");
    document.getElementById("viewShop").classList.toggle("on", v === "shopping");
    document.getElementById("viewFamily").classList.toggle("on", v === "family");
    document.getElementById("viewHint").textContent = (v === "shopping")
      ? "Showing only what\u2019s missing. Switch back to full inventory to make changes."
      : (v === "family")
      ? "Showing what\u2019s missing for everyone. Switch back to full inventory to make changes."
      : "Tap a cell to mark have / don\u2019t have. Tap the pencil for quantity and notes.";
    renderGrid();
  }

  function renderAll() { renderTabs(); renderPageTabs(); renderGrid(); }

  // ---------- structural edits ----------
  function addPerson() {
    var name = window.prompt("Name for the new person:", "Person " + (state.people.length + 1));
    if (name === null) return;
    name = name.trim() || ("Person " + (state.people.length + 1));
    var src = activePerson();
    var colorIdx = state.people.length;
    var np = { id: uid("p"), name: name, color: colorForIndex(colorIdx) };
    state.people.push(np);
    state.pages.forEach(function (pg) {
      var srcRows = pageRows(pg, src.id);
      pg.rows[np.id] = srcRows.map(function (r) { return { id: uid("r"), label: r.label, sub: r.sub }; });
    });
    state.activePersonId = np.id;
    save(); renderAll();
    if (document.getElementById("settingsOverlay").classList.contains("open")) renderSettings();
    toast("Added " + name);
  }

  function addPage() {
    var label = window.prompt("Name for the new page (e.g. Coats, Pants, Hats):", "");
    if (label === null) return;
    label = label.trim(); if (!label) return;
    var pg = { id: uid("pg"), label: label, rowHeader: "Size", categories: [], rows: {} };
    state.people.forEach(function (p) { pg.rows[p.id] = []; });
    state.pages.push(pg);
    state.activePageId = pg.id;
    save(); renderAll();
    if (document.getElementById("settingsOverlay").classList.contains("open")) renderSettings();
    toast("Added page: " + label);
  }

  function addCategory() {
    var name = window.prompt("Name for the new column (e.g. Winter coat, Rain jacket):", "");
    if (name === null) return;
    name = name.trim(); if (!name) return;
    activePage().categories.push({ id: uid("c"), label: name });
    save(); renderGrid(); renderSettings();
    toast("Added column: " + name);
  }

  function addRow() {
    var label = window.prompt("Row label (e.g. Size 5, or 3T, or Age 9):", "");
    if (label === null) return;
    label = label.trim(); if (!label) return;
    var sub = window.prompt("Small print under it (optional, e.g. 5\u20135.5 yrs):", "");
    if (sub === null) sub = "";
    var page = activePage();
    var pid = activePerson().id;
    if (!page.rows[pid]) page.rows[pid] = [];
    page.rows[pid].push({ id: uid("r"), label: label, sub: sub.trim() });
    save(); renderGrid(); renderSettings();
    toast("Added row: " + label);
  }

  function moveItem(arr, idx, dir) {
    var j = idx + dir;
    if (j < 0 || j >= arr.length) return;
    var t = arr[idx]; arr[idx] = arr[j]; arr[j] = t;
  }

  // ---------- settings ----------
  function settingsPage() {
    if (!settingsPageId) settingsPageId = state.activePageId;
    var pg = state.pages.filter(function (p) { return p.id === settingsPageId; })[0];
    return pg || state.pages[0];
  }

  function copyColumnsFrom(srcPage, destPage) {
    var existing = {};
    destPage.categories.forEach(function (c) { existing[c.label.toLowerCase()] = true; });
    var added = 0;
    srcPage.categories.forEach(function (c) {
      if (!existing[c.label.toLowerCase()]) {
        destPage.categories.push({ id: uid("c"), label: c.label });
        added++;
      }
    });
    save(); renderGrid(); renderSettings();
    toast(added ? "Copied " + added + " column" + (added !== 1 ? "s" : "") + " from " + srcPage.label
      : "No new columns to copy \u2014 all already exist.");
  }

  function copyRowsFrom(srcPage, destPage) {
    var added = 0;
    state.people.forEach(function (p) {
      var srcRows = pageRows(srcPage, p.id);
      if (!destPage.rows[p.id]) destPage.rows[p.id] = [];
      var existing = {};
      destPage.rows[p.id].forEach(function (r) { existing[r.label.toLowerCase()] = true; });
      srcRows.forEach(function (r) {
        if (!existing[r.label.toLowerCase()]) {
          destPage.rows[p.id].push({ id: uid("r"), label: r.label, sub: r.sub });
          added++;
        }
      });
    });
    save(); renderGrid(); renderSettings();
    toast(added ? "Copied " + added + " row" + (added !== 1 ? "s" : "") + " from " + srcPage.label
      : "No new rows to copy \u2014 all already exist.");
  }

  function renderSettings() {
    var body = document.getElementById("settingsBody");
    body.innerHTML = "";
    var person = activePerson();
    var page = settingsPage();
    var rows = pageRows(page, person.id);

    // Pages
    var pgs = el("div", "sect");
    pgs.appendChild(el("span", "cap", "Pages (clothing categories)"));
    pgs.appendChild(el("div", "sectsub", "Each page has its own columns and rows. Shopping list compiles them all."));
    state.pages.forEach(function (pg, i) {
      var r = el("div", "editrow");
      var inp = el("input"); inp.type = "text"; inp.value = pg.label;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
      inp.addEventListener("blur", function () {
        var v = inp.value.trim(); if (v && v !== pg.label) { pg.label = v; save(); renderPageTabs(); }
        else { inp.value = pg.label; }
      });
      r.appendChild(inp);
      r.appendChild(mini(ICON.up, "Move up", i === 0, function () { moveItem(state.pages, i, -1); save(); renderPageTabs(); renderSettings(); }));
      r.appendChild(mini(ICON.down, "Move down", i === state.pages.length - 1, function () { moveItem(state.pages, i, 1); save(); renderPageTabs(); renderSettings(); }));
      r.appendChild(mini(ICON.trash, "Remove page", state.pages.length <= 1, function () { removePage(pg); }, true));
      pgs.appendChild(r);
    });
    var addPg = el("button", "addbtn"); addPg.type = "button"; addPg.innerHTML = ICON.plus + "<span>Add page</span>";
    addPg.addEventListener("click", addPage); pgs.appendChild(addPg);
    body.appendChild(pgs);

    // Page tab bar for settings
    var ptbar = el("div", "setpagetabs");
    state.pages.forEach(function (pg) {
      var tb = el("button", "setpagetab" + (pg.id === page.id ? " active" : ""), pg.label);
      tb.type = "button";
      tb.addEventListener("click", function () { settingsPageId = pg.id; renderSettings(); });
      ptbar.appendChild(tb);
    });
    body.appendChild(ptbar);

    // Columns for this page
    var cs = el("div", "sect");
    cs.appendChild(el("span", "cap", "Columns for " + page.label + " (apply to everyone)"));
    cs.appendChild(el("div", "sectsub", "Rename by typing; use the arrows to reorder; the trash removes the column."));
    page.categories.forEach(function (cat, i) {
      var r = el("div", "editrow");
      var inp = el("input"); inp.type = "text"; inp.value = cat.label;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
      inp.addEventListener("blur", function () {
        var v = inp.value.trim(); if (v && v !== cat.label) { cat.label = v; save(); renderGrid(); }
        else { inp.value = cat.label; }
      });
      r.appendChild(inp);
      r.appendChild(mini(ICON.up, "Move up", i === 0, function () { moveItem(page.categories, i, -1); save(); renderGrid(); renderSettings(); }));
      r.appendChild(mini(ICON.down, "Move down", i === page.categories.length - 1, function () { moveItem(page.categories, i, 1); save(); renderGrid(); renderSettings(); }));
      r.appendChild(mini(ICON.trash, "Remove column", false, function () { removeCategory(cat); }, true));
      cs.appendChild(r);
    });
    var addC = el("button", "addbtn"); addC.type = "button"; addC.innerHTML = ICON.plus + "<span>Add column</span>";
    addC.addEventListener("click", function () {
      var prev = state.activePageId;
      state.activePageId = page.id;
      addCategory();
      state.activePageId = prev;
    });
    cs.appendChild(addC);
    var otherPagesForCols = state.pages.filter(function (pg) { return pg.id !== page.id && pg.categories.length > 0; });
    if (otherPagesForCols.length) {
      var copyDiv = el("div"); copyDiv.style.marginTop = "8px";
      otherPagesForCols.forEach(function (src) {
        var cb = el("button", "copybtn", "Copy columns from " + src.label);
        cb.type = "button";
        cb.addEventListener("click", function () { copyColumnsFrom(src, page); });
        copyDiv.appendChild(cb);
      });
      cs.appendChild(copyDiv);
    }
    body.appendChild(cs);

    // Rows for this person on this page
    var rs = el("div", "sect");
    rs.appendChild(el("span", "cap", "Rows for " + person.name + " on " + page.label));
    rs.appendChild(el("div", "sectsub", "These rows are specific to this person on this page. Use \u201CCopy rows from\u201D to pull in rows from another page."));
    var rh = el("div", "rowhead");
    var rhl = el("label", null, "Row-header word:");
    var rhi = el("input"); rhi.type = "text"; rhi.value = page.rowHeader;
    rhi.addEventListener("keydown", function (e) { if (e.key === "Enter") rhi.blur(); });
    rhi.addEventListener("blur", function () { var v = rhi.value.trim(); if (v && v !== page.rowHeader) { page.rowHeader = v; save(); renderGrid(); } else { rhi.value = page.rowHeader; } });
    rh.appendChild(rhl); rh.appendChild(rhi); rs.appendChild(rh);

    rows.forEach(function (row, i) {
      var r = el("div", "editrow");
      var lab = el("input"); lab.type = "text"; lab.value = row.label;
      lab.addEventListener("keydown", function (e) { if (e.key === "Enter") lab.blur(); });
      lab.addEventListener("blur", function () { var v = lab.value.trim(); if (v && v !== row.label) { row.label = v; save(); renderGrid(); } else { lab.value = row.label; } });
      var sub = el("input", "sub"); sub.type = "text"; sub.value = row.sub || ""; sub.placeholder = "small print";
      sub.addEventListener("keydown", function (e) { if (e.key === "Enter") sub.blur(); });
      sub.addEventListener("blur", function () { var v = sub.value.trim(); if (v !== (row.sub || "")) { row.sub = v; save(); renderGrid(); } });
      r.appendChild(lab); r.appendChild(sub);
      r.appendChild(mini(ICON.up, "Move up", i === 0, function () { moveItem(rows, i, -1); save(); renderGrid(); renderSettings(); }));
      r.appendChild(mini(ICON.down, "Move down", i === rows.length - 1, function () { moveItem(rows, i, 1); save(); renderGrid(); renderSettings(); }));
      r.appendChild(mini(ICON.trash, "Remove row", false, function () { removeRow(person, row); }, true));
      rs.appendChild(r);
    });
    var addR = el("button", "addbtn"); addR.type = "button"; addR.innerHTML = ICON.plus + "<span>Add row</span>";
    addR.addEventListener("click", function () {
      var prev = state.activePageId;
      state.activePageId = page.id;
      addRow();
      state.activePageId = prev;
    });
    rs.appendChild(addR);
    var otherPagesForRows = state.pages.filter(function (pg) {
      return pg.id !== page.id && pageRows(pg, person.id).length > 0;
    });
    if (otherPagesForRows.length) {
      var copyRDiv = el("div"); copyRDiv.style.marginTop = "8px";
      otherPagesForRows.forEach(function (src) {
        var cb = el("button", "copybtn", "Copy rows from " + src.label);
        cb.type = "button";
        cb.addEventListener("click", function () { copyRowsFrom(src, page); });
        copyRDiv.appendChild(cb);
      });
      rs.appendChild(copyRDiv);
    }
    body.appendChild(rs);

    // This person
    var ps = el("div", "sect");
    ps.appendChild(el("span", "cap", "This person"));
    var pr = el("div", "rowhead");
    var pl = el("label", null, "Name:");
    var pn = el("input"); pn.type = "text"; pn.value = person.name; pn.style.width = "180px";
    pn.addEventListener("keydown", function (e) { if (e.key === "Enter") pn.blur(); });
    pn.addEventListener("blur", function () { var v = pn.value.trim(); if (v && v !== person.name) { person.name = v; save(); renderTabs(); document.getElementById("personName").textContent = v; } else { pn.value = person.name; } });
    pr.appendChild(pl); pr.appendChild(pn); ps.appendChild(pr);

    var colorCap = el("div", "cap", "Color");
    colorCap.style.marginTop = "12px";
    ps.appendChild(colorCap);
    ps.appendChild(el("div", "sectsub", "Auto-assigned when added \u2014 tap a swatch to change it for " + person.name + "."));
    var swrow = el("div", "swatchrow");
    PALETTE.forEach(function (c) {
      var sw = document.createElement("button");
      sw.type = "button";
      var isSel = person.color && person.color.primary === c.primary;
      sw.className = "swatch" + (isSel ? " sel" : "");
      sw.style.background = c.primary;
      sw.title = c.name;
      sw.setAttribute("aria-label", c.name);
      sw.addEventListener("click", function () {
        setPersonColor(person.id, c);
        renderTabs(); renderSettings();
        toast(person.name + "\u2019s color set to " + c.name);
      });
      swrow.appendChild(sw);
    });
    ps.appendChild(swrow);

    var del = el("button", "dangerbtn", "Delete " + person.name);
    del.type = "button";
    del.style.marginTop = "14px";
    if (state.people.length <= 1) { del.disabled = true; del.title = "Can\u2019t delete the only person"; }
    del.addEventListener("click", function () { removePerson(person); });
    ps.appendChild(del);
    body.appendChild(ps);

    // About
    var ab = el("div", "sect");
    ab.appendChild(el("span", "cap", "About"));
    ab.appendChild(el("div", "aboutmeta", "Our Closet \u2014 version " + VERSION));
    ab.appendChild(el("div", "aboutmeta", "Saves on this device only. No accounts, no internet, no names stored unless you type them."));
    var cl = el("div", "changelog");
    CHANGELOG.forEach(function (e) {
      cl.appendChild(el("div", "cv", "v" + e.v + "  \u00B7  " + e.d));
      var ul = el("ul");
      e.notes.forEach(function (n) { ul.appendChild(el("li", null, n)); });
      cl.appendChild(ul);
    });
    ab.appendChild(cl);
    ab.appendChild(el("div", "secline", "Tip: Export a backup now and then, and before trying a new version."));
    body.appendChild(ab);
  }

  function mini(svg, title, disabled, fn, isDel) {
    var b = document.createElement("button");
    b.className = "minibtn" + (isDel ? " del" : "");
    b.type = "button"; b.title = title; b.innerHTML = svg;
    if (disabled) b.disabled = true; else b.addEventListener("click", fn);
    return b;
  }

  function pruneOwned() {
    var valid = {};
    state.pages.forEach(function (pg) {
      state.people.forEach(function (p) {
        var rows = pageRows(pg, p.id);
        rows.forEach(function (r) {
          pg.categories.forEach(function (c) { valid[key(p.id, pg.id, r.id, c.id)] = true; });
        });
      });
    });
    Object.keys(state.owned).forEach(function (k) { if (!valid[k]) delete state.owned[k]; });
  }

  function removeCategory(cat) {
    var page = settingsPageId ? settingsPage() : activePage();
    if (!window.confirm("Remove the column \u201C" + cat.label + "\u201D for everyone? Its checkmarks will be deleted.")) return;
    page.categories = page.categories.filter(function (c) { return c.id !== cat.id; });
    pruneOwned(); save(); renderGrid(); renderSettings();
    toast("Removed column: " + cat.label);
  }
  function removeRow(person, row) {
    var page = settingsPageId ? settingsPage() : activePage();
    var rows = pageRows(page, person.id);
    if (!window.confirm("Remove the row \u201C" + row.label + "\u201D from " + person.name + "? Its checkmarks will be deleted.")) return;
    page.rows[person.id] = rows.filter(function (r) { return r.id !== row.id; });
    pruneOwned(); save(); renderGrid(); renderSettings();
    toast("Removed row: " + row.label);
  }
  function removePerson(person) {
    if (state.people.length <= 1) return;
    if (!window.confirm("Delete " + person.name + " and all their checkmarks? This can\u2019t be undone.")) return;
    state.people = state.people.filter(function (p) { return p.id !== person.id; });
    state.pages.forEach(function (pg) { delete pg.rows[person.id]; });
    if (state.activePersonId === person.id) state.activePersonId = state.people[0].id;
    pruneOwned(); save(); renderAll(); renderSettings();
    toast("Deleted " + person.name);
  }
  function removePage(pg) {
    if (state.pages.length <= 1) return;
    if (!window.confirm("Delete the page \u201C" + pg.label + "\u201D and all its columns, rows, and checkmarks? This can\u2019t be undone.")) return;
    state.pages = state.pages.filter(function (p) { return p.id !== pg.id; });
    if (state.activePageId === pg.id) state.activePageId = state.pages[0].id;
    pruneOwned(); save(); renderAll(); renderSettings();
    toast("Deleted page: " + pg.label);
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1900);
  }

  // ---------- modal open/close ----------
  function openSettings() { settingsPageId = state.activePageId; renderSettings(); document.getElementById("settingsOverlay").classList.add("open"); }
  function closeSettings() { document.getElementById("settingsOverlay").classList.remove("open"); }

  // ---------- wiring ----------
  function wire() {
    document.getElementById("viewInv").addEventListener("click", function () { setView("inventory"); });
    document.getElementById("viewShop").addEventListener("click", function () { setView("shopping"); });
    document.getElementById("viewFamily").addEventListener("click", function () { setView("family"); });
    document.getElementById("gearBtn").addEventListener("click", openSettings);
    document.getElementById("settingsClose").addEventListener("click", closeSettings);
    document.getElementById("settingsOverlay").addEventListener("click", function (e) { if (e.target === this) closeSettings(); });
    document.getElementById("cellClose").addEventListener("click", function () { commitNotes(); closeCell(); });
    document.getElementById("cellOverlay").addEventListener("click", function (e) { if (e.target === this) { commitNotes(); closeCell(); } });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") { commitNotes(); closeCell(); closeSettings(); } });
    document.getElementById("exportBtn").addEventListener("click", doExport);
    document.getElementById("importBtn").addEventListener("click", function () { document.getElementById("importFile").click(); });
    document.getElementById("importFile").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var obj = null;
        try { obj = JSON.parse(reader.result); } catch (err) { toast("That file isn\u2019t valid JSON."); return; }
        importFromObject(obj);
      };
      reader.onerror = function () { toast("Couldn\u2019t read that file."); };
      reader.readAsText(f);
    });
  }

  window.__inv = {
    getState: function () { return state; },
    has: has, qtyOf: qtyOf, notesOf: notesOf, setQty: setQty, setNotesArr: setNotesArr,
    buildBackupJSON: buildBackupJSON, validateBackup: validateBackup,
    migrate: migrate, normCell: normCell, defaultState: defaultState,
    addPerson: addPerson, addPage: addPage, addCategory: addCategory, addRow: addRow,
    removeCategory: removeCategory, removeRow: removeRow, removePerson: removePerson, removePage: removePage,
    importFromObject: importFromObject, setView: setView, renderFamilyList: renderFamilyList,
    copyColumnsFrom: copyColumnsFrom, copyRowsFrom: copyRowsFrom,
    renderAll: renderAll, activePage: activePage, pageRows: pageRows,
    STORAGE_KEY: STORAGE_KEY, VERSION: VERSION,
    PALETTE: PALETTE, colorForIndex: colorForIndex, setPersonColor: setPersonColor, applyPersonTheme: applyPersonTheme
  };

  load();
  wire();
  renderAll();
})();
</script>

<!-- ===== SELF-TEST PANEL — safe to delete; runs only when URL ends in ?test ===== -->
<div id="selftest" style="display:none;position:fixed;top:0;right:0;max-width:380px;
  max-height:100vh;overflow:auto;background:#111;color:#eee;font:12px/1.4 monospace;
  padding:10px;z-index:99999;border-left:2px solid #555"></div>
<script>
(function () {
  if (location.search.indexOf('test') === -1) return;
  var panel = document.getElementById('selftest');
  panel.style.display = 'block';
  var pass = 0, fail = 0, log = [];
  function check(name, cond) { if (cond) { pass++; log.push('PASS  ' + name); } else { fail++; log.push('FAIL  ' + name); } }
  function render() {
    panel.innerHTML = '<b>' + (fail === 0 ? 'ALL PASS' : fail + ' FAILED') + '</b> (' + pass + '/' + (pass + fail) + ')<br>' +
      log.map(function (l) { var red = l.indexOf('FAIL') === 0; return '<span style="color:' + (red ? '#f66' : '#6f6') + '">' + l + '</span>'; }).join('<br>');
  }
  window.confirm = function () { return true; };

  setTimeout(function () {
    var api = window.__inv;
    var savedRaw = null;
    try { savedRaw = localStorage.getItem(api.STORAGE_KEY); } catch (e) {}

    try {
      var S = api.getState();

      // --- data model is v4 with pages ---
      check('State has pages array', Array.isArray(S.pages) && S.pages.length > 0);
      check('First page is Footwear', S.pages[0].label === 'Footwear');
      check('People no longer have rows', S.people[0].rows === undefined);
      check('Page has rows keyed by person', Array.isArray(S.pages[0].rows['p1']));
      check('Page has categories', Array.isArray(S.pages[0].categories) && S.pages[0].categories.length === 5);

      // --- person colors ---
      check('People have colors assigned', S.people.every(function (p) { return p.color && typeof p.color.primary === 'string'; }));
      check('First two people have different colors', S.people[0].color.primary !== S.people[1].color.primary);
      check('First person color matches palette rotation', S.people[0].color.primary === api.colorForIndex(0).primary);
      check('Second person color matches palette rotation', S.people[1].color.primary === api.colorForIndex(1).primary);
      check('--person CSS var matches active person on load',
        getComputedStyle(document.documentElement).getPropertyValue('--person').trim().toLowerCase() === S.people[0].color.primary.toLowerCase());

      // --- page tabs render ---
      var pageTabs = document.querySelectorAll('#pageTabs .pagetab:not(.addpg)');
      check('Page tabs render', pageTabs.length === S.pages.length);

      // --- person tabs ---
      var tabBtns = document.querySelectorAll('#tabs .tab:not(.add)');
      check('Two person tabs render', tabBtns.length === 2);

      // --- pre-fill data (now uses 4-part keys) ---
      check('Person 1 size 8 sneakers = have', api.has('p1', 'footwear', 's8', 'sneakers'));
      check('Person 2 size 13 crocs = have', api.has('p2', 'footwear', 'b13', 'crocs'));
      check('Old note migrated ("reg")', api.notesOf('p1', 'footwear', 's9', 'sneakers')[0] === 'reg');

      // --- switch person, confirm grid + color shift ---
      tabBtns[1].click();
      var p2wrap = document.querySelector('.cellwrap[data-r="b12"][data-c="sneakers"] button.tog');
      check('Switching person tab shows their grid', !!p2wrap && p2wrap.classList.contains('have'));
      check('Switching person updates --person CSS var',
        getComputedStyle(document.documentElement).getPropertyValue('--person').trim().toLowerCase() === S.people[1].color.primary.toLowerCase());
      check('whoLabel updates to switched person', document.getElementById('whoLabel').textContent === S.people[1].name);
      tabBtns[0].click();
      check('Switching back restores --person CSS var',
        getComputedStyle(document.documentElement).getPropertyValue('--person').trim().toLowerCase() === S.people[0].color.primary.toLowerCase());

      // --- quick tap toggle ---
      var togBtn = document.querySelector('.cellwrap[data-r="s11"][data-c="rainboots"] button.tog');
      var before = api.has('p1', 'footwear', 's11', 'rainboots');
      togBtn.click();
      check('Quick tap flips cell', api.has('p1', 'footwear', 's11', 'rainboots') === !before);
      togBtn.click();
      check('Quick tap flips back', api.has('p1', 'footwear', 's11', 'rainboots') === before);

      // --- quantity display ---
      api.setQty('p1', 'footwear', 's8', 'sneakers', 3); api.renderAll();
      check('Cell shows number when qty > 1', document.querySelector('.cellwrap[data-r="s8"][data-c="sneakers"] .mk').textContent === '3');
      api.setQty('p1', 'footwear', 's8', 'sneakers', 1); api.renderAll();
      check('Cell shows check when qty = 1', document.querySelector('.cellwrap[data-r="s8"][data-c="sneakers"] .mk').textContent === '\u2713');

      // --- pencil editor ---
      document.querySelector('.cellwrap[data-r="s8"][data-c="sandals"] button.pencil').click();
      check('Pencil opens editor', document.getElementById('cellOverlay').classList.contains('open'));
      check('Editor titled correctly', /Sandals/.test(document.getElementById('cellTitle').textContent));
      check('Existing note shows', document.querySelector('#cellNoteList .noteinput').value === 'may change');
      document.querySelector('#cellBody .addbtn').click();
      var newInput = document.querySelectorAll('#cellNoteList .noteinput')[1];
      newInput.value = 'hand-me-down';
      newInput.dispatchEvent(new Event('blur'));
      check('Multiple notes work', api.notesOf('p1','footwear','s8','sandals').length === 2);
      var steppers = document.querySelectorAll('#cellBody .stepbtn');
      steppers[1].click();
      check('Editor + increases qty', api.qtyOf('p1','footwear','s8','sandals') === 2);
      steppers[0].click();
      var noteRows = document.querySelectorAll('#cellNoteList .noterow');
      noteRows[noteRows.length - 1].querySelector('.minibtn.del').click();
      check('Editor can remove note', api.notesOf('p1','footwear','s8','sandals').length === 1);
      document.querySelector('#cellBody .primarybtn').click();
      check('Done closes editor', !document.getElementById('cellOverlay').classList.contains('open'));

      // --- add / remove column ---
      var page = api.activePage();
      var catCountBefore = page.categories.length;
      window.prompt = function () { return 'Coat'; };
      api.addCategory();
      check('Add column adds one', page.categories.length === catCountBefore + 1);
      var coat = page.categories[page.categories.length - 1];
      check('New column in grid', Array.prototype.some.call(document.querySelectorAll('#grid thead th'), function (th) { return th.textContent.indexOf('Coat') === 0; }));
      document.querySelector('.cellwrap[data-r="s8"][data-c="' + coat.id + '"] button.tog').click();
      check('Can check new column', api.has('p1', 'footwear', 's8', coat.id));
      api.removeCategory(coat);
      check('Remove column works', page.categories.length === catCountBefore);

      // --- add / remove row ---
      var rows = api.pageRows(page, 'p1');
      var rowsBefore = rows.length;
      var promptCalls = 0;
      window.prompt = function () { promptCalls++; return promptCalls === 1 ? 'Size 5' : '9 yrs'; };
      api.addRow();
      check('Add row adds one', api.pageRows(page, 'p1').length === rowsBefore + 1);
      var newRow = api.pageRows(page, 'p1')[api.pageRows(page, 'p1').length - 1];
      api.removeRow({ id: 'p1', name: 'Person 1' }, newRow);
      check('Remove row works', api.pageRows(page, 'p1').length === rowsBefore);

      // --- add / remove person (checks color auto-assignment too) ---
      var peopleBefore = S.people.length;
      window.prompt = function () { return 'Person X'; };
      api.addPerson();
      check('Add person adds tab', document.querySelectorAll('#tabs .tab:not(.add)').length === peopleBefore + 1);
      var added = S.people[S.people.length - 1];
      check('New person has rows on page', api.pageRows(page, added.id).length > 0);
      check('New person auto-assigned a color', added.color && typeof added.color.primary === 'string');
      check('New person color follows palette rotation', added.color.primary === api.colorForIndex(peopleBefore).primary);
      api.removePerson(added);
      check('Delete person works', S.people.length === peopleBefore);

      // --- setPersonColor API ---
      var testPerson = S.people[0];
      var originalColor = { name: testPerson.color.name, primary: testPerson.color.primary, deep: testPerson.color.deep, soft: testPerson.color.soft };
      var altColor = api.PALETTE[0].primary === originalColor.primary ? api.PALETTE[1] : api.PALETTE[0];
      api.setPersonColor(testPerson.id, altColor);
      check('setPersonColor updates person color', testPerson.color.primary === altColor.primary);
      check('setPersonColor updates CSS var when active',
        getComputedStyle(document.documentElement).getPropertyValue('--person').trim().toLowerCase() === altColor.primary.toLowerCase());
      api.setPersonColor(testPerson.id, originalColor);
      check('Color restored after API test', testPerson.color.primary === originalColor.primary);
      api.applyPersonTheme();

      // --- Settings swatch picker (real click-through) ---
      document.getElementById('gearBtn').click();
      check('Settings opens', document.getElementById('settingsOverlay').classList.contains('open'));
      var swatches = document.querySelectorAll('.swatchrow .swatch');
      check('Color swatches render in Settings', swatches.length === api.PALETTE.length);
      var selSwatch = document.querySelector('.swatchrow .swatch.sel');
      check('One swatch marked selected', !!selSwatch);
      check('Selected swatch matches current color name', !!selSwatch && selSwatch.title === testPerson.color.name);
      var beforeSwatchColor = testPerson.color.primary;
      var otherSwatch = Array.prototype.filter.call(swatches, function (s) { return !s.classList.contains('sel'); })[0];
      otherSwatch.click();
      check('Clicking a swatch changes the person color', testPerson.color.primary !== beforeSwatchColor);
      check('Clicking a swatch updates --person CSS var',
        getComputedStyle(document.documentElement).getPropertyValue('--person').trim().toLowerCase() === testPerson.color.primary.toLowerCase());
      // restore to original so the rest of the tests (and the user's real data) are undisturbed
      api.setPersonColor(testPerson.id, originalColor);
      document.getElementById('settingsClose').click();
      check('Settings closes', !document.getElementById('settingsOverlay').classList.contains('open'));

      // --- add / remove page ---
      var pagesBefore = S.pages.length;
      window.prompt = function () { return 'Coats'; };
      api.addPage();
      check('Add page adds one', S.pages.length === pagesBefore + 1);
      var newPg = S.pages[S.pages.length - 1];
      check('New page has correct label', newPg.label === 'Coats');
      check('New page has empty rows for each person', Array.isArray(newPg.rows['p1']));
      check('Page tabs updated', document.querySelectorAll('#pageTabs .pagetab:not(.addpg)').length === S.pages.length);
      api.removePage(newPg);
      check('Remove page works', S.pages.length === pagesBefore);

      // --- backup ---
      check('Good backup passes validation', api.validateBackup(JSON.parse(api.buildBackupJSON())) === null);
      check('Junk backup rejected', typeof api.validateBackup({ nope: 1 }) === 'string');
      check('Backup has version + owned', /"version"/.test(api.buildBackupJSON()) && /"owned"/.test(api.buildBackupJSON()));

      // --- cell conversion ---
      var nc = api.normCell({ have: true, note: 'reg fit' });
      check('Old {have,note} converts', nc.qty === 1 && nc.notes[0] === 'reg fit');

      // --- migration from v0.3 (3-part keys) ---
      var v3 = { version: 3, rowHeader: 'Size',
        categories: [{ id: 'sneakers', label: 'Sneakers' }],
        people: [{ id: 'p1', name: 'P1', rows: [{ id: 's1', label: 'Size 1', sub: '' }] }],
        owned: { 'p1|s1|sneakers': { qty: 1, notes: ['test'] } },
        activePersonId: 'p1' };
      var m3 = api.migrate(v3);
      check('v3 migrates to v4 with pages', m3.version === 4 && Array.isArray(m3.pages));
      check('v3 owned rekeyed to 4-part', m3.owned['p1|footwear|s1|sneakers'] && m3.owned['p1|footwear|s1|sneakers'].qty === 1);
      check('v3 rows moved to page', api.pageRows(m3.pages[0], 'p1').length === 1);
      check('v3 migration assigns colors', m3.people.every(function (p) { return p.color && typeof p.color.primary === 'string'; }));

      // --- migration from v0.1 ---
      var v1 = { version: 1, owned: { 'p1|s3|sneakers': { have: true, note: 'v1 edit' } } };
      var m1 = api.migrate(v1);
      check('v1 mark migrated (4-part key, qty)', m1.owned['p1|footwear|s3|sneakers'] && m1.owned['p1|footwear|s3|sneakers'].qty === 1);
      check('v1 note carried', m1.owned['p1|footwear|s3|sneakers'].notes[0] === 'v1 edit');
      check('v1 migration assigns colors', m1.people.every(function (p) { return p.color && typeof p.color.primary === 'string'; }));

      // --- grid + / - buttons ---
      var addColBtn = document.querySelector('thead .gridplus');
      check('Add-column button on grid', !!addColBtn);
      var addRowBtn = document.querySelector('.addrowtr .gridplus');
      check('Add-row button on grid', !!addRowBtn);
      var delColBtns = document.querySelectorAll('thead .delcol');
      check('Remove-column buttons on headers', delColBtns.length === page.categories.length);
      var delRowBtns = document.querySelectorAll('tbody .delrow');
      check('Remove-row buttons on rows', delRowBtns.length === api.pageRows(page, 'p1').length);

      // --- copy columns/rows between pages ---
      window.prompt = function () { return 'Coats'; };
      api.addPage();
      var coatsPage = S.pages[S.pages.length - 1];
      check('Coats page starts with 0 columns', coatsPage.categories.length === 0);
      api.copyColumnsFrom(page, coatsPage);
      check('Copy columns populates Coats', coatsPage.categories.length === page.categories.length);
      check('Copied columns have new IDs', coatsPage.categories[0].id !== page.categories[0].id);
      // Copy again should not duplicate
      var countBefore = coatsPage.categories.length;
      api.copyColumnsFrom(page, coatsPage);
      check('Copy columns skips duplicates', coatsPage.categories.length === countBefore);
      // Copy rows
      check('Coats page starts with 0 rows for p1', api.pageRows(coatsPage, 'p1').length === 0);
      api.copyRowsFrom(page, coatsPage);
      check('Copy rows populates Coats', api.pageRows(coatsPage, 'p1').length === api.pageRows(page, 'p1').length);
      // Clean up test page
      api.removePage(coatsPage);

      // --- shopping list (grocery, compiled) ---
      api.setView('shopping');
      check('Shopping view activates', document.getElementById('viewShop').classList.contains('on'));
      var shopSummary = document.getElementById('shopSummary');
      check('Shopping summary visible', shopSummary.style.display === 'block');
      check('Summary has count', /\d/.test(shopSummary.textContent));
      var groups = document.querySelectorAll('#shopList .shopgroup');
      check('Shopping list has groups', groups.length > 0);
      var shopItems = document.querySelectorAll('#shopList .shoprow');
      check('Shopping list has items', shopItems.length > 0);

      // Collapse
      groups[0].querySelector('.shophead').click();
      check('Collapse works', groups[0].classList.contains('collapsed'));
      groups[0].querySelector('.shophead').click();
      check('Expand works', !groups[0].classList.contains('collapsed'));

      // Check off an item
      var firstItem = shopItems[0];
      firstItem.click();
      check('Tap marks got (qty 1)', firstItem.classList.contains('got'));
      firstItem.click();
      check('Tap again undoes', !firstItem.classList.contains('got'));

      // --- family list ---
      api.setView('family');
      check('Family view activates', document.getElementById('viewFamily').classList.contains('on'));
      var famSummary = document.getElementById('shopSummary');
      check('Family summary visible', famSummary.style.display === 'block');
      check('Family summary mentions people', /people|person/.test(famSummary.textContent));
      var famGroups = document.querySelectorAll('#shopList .shopgroup-person');
      check('Family list has person groups', famGroups.length > 0);
      var famItems = document.querySelectorAll('#shopList .shoprow');
      check('Family list has items', famItems.length > 0);
      // Collapse a person group
      famGroups[0].querySelector('.shophead').click();
      check('Person group collapses', famGroups[0].classList.contains('collapsed'));
      famGroups[0].querySelector('.shophead').click();
      check('Person group expands', !famGroups[0].classList.contains('collapsed'));
      // Check off an item
      var famFirstItem = document.querySelectorAll('#shopList .shoprow')[0];
      famFirstItem.click();
      check('Family list tap marks got', famFirstItem.classList.contains('got'));
      famFirstItem.click();
      check('Family list tap undoes', !famFirstItem.classList.contains('got'));

      api.setView('shopping');

      // All-set
      S.pages.forEach(function (pg) {
        S.people.forEach(function (p) {
          api.pageRows(pg, p.id).forEach(function (row) {
            pg.categories.forEach(function (cat) {
              if (!api.has(p.id, pg.id, row.id, cat.id)) api.setQty(p.id, pg.id, row.id, cat.id, 1);
            });
          });
        });
      });
      api.setView('shopping');
      check('All-set shows', /All set/.test(shopSummary.textContent));

      api.setView('inventory');
      var allRows = api.pageRows(api.activePage(), 'p1');
      check('Switch back restores grid', document.querySelectorAll('#grid tbody tr:not(.addrowtr)').length === allRows.length);

      // --- persistence ---
      var saved = JSON.parse(localStorage.getItem(api.STORAGE_KEY));
      check('Saved as v4', saved && saved.version === 4 && Array.isArray(saved.pages));
      check('Saved data includes person colors', saved.people.every(function (p) { return p.color && typeof p.color.primary === 'string'; }));

    } catch (e) {
      check('Tests ran without crashing \u2014 ' + e.message, false);
    }

    try {
      if (savedRaw === null) localStorage.removeItem(api.STORAGE_KEY);
      else localStorage.setItem(api.STORAGE_KEY, savedRaw);
    } catch (e) {}
    render();
  }, 250);
})();
</script>
<!-- ===== END SELF-TEST PANEL ===== -->

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}
</script>
